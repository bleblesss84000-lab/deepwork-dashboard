<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strava &amp; Claude — 9:16 Overlay</title>
<style>
  /* 9:16 frame — 1080 × 1920. The frame itself is fully transparent:
     nothing behind the overlay is drawn, altered, or covered. */
  html, body { margin: 0; padding: 0; background: transparent; }

  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif;
  }

  /* Overlay: 72% of frame width, centered horizontally (14% margin each
     side, ≈12% per brief), top edge at 12% of frame height. Everything
     stays in the upper band of the frame, above a subject's forehead. */
  .overlay {
    position: absolute;
    top: 12%;               /* 230.4px */
    left: 14%;              /* centered: (100% − 72%) / 2 */
    width: 72%;             /* 777.6px */
  }

  /* Three adjacent blocks on one horizontal line, zero gaps,
     flat solid colors, no radius / border / shadow / gradient. */
  .blocks {
    display: flex;
    width: 100%;
    align-items: stretch;
    font-size: 0;           /* kill any inline-gap artifacts */
  }
  .block {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Left & right blocks: 38% of overlay width each, square. */
  .block-strava {
    width: 38%;
    aspect-ratio: 1 / 1;
    background: #FC4C02;    /* Strava brand orange-red */
  }
  .block-amp {
    width: 24%;             /* narrow vertical rectangle */
    background: #F7F0E4;    /* warm cream */
  }
  .block-claude {
    width: 38%;
    aspect-ratio: 1 / 1;
    background: #D97757;    /* Claude muted coral / terracotta */
  }

  /* Logos: official paths, white, centered, large. */
  .block-strava svg { width: 62%; height: 62%; }
  .block-claude svg { width: 70%; height: 70%; }

  .amp {
    font-size: 158px;
    font-weight: 700;
    color: #FC4C02;
    line-height: 1;
    /* optical centering of the glyph inside the cream block */
    transform: translateY(-2px);
  }

  /* Labels: identical font, size, weight, color for both. */
  .labels {
    display: flex;
    width: 100%;
    margin-top: 18px;
  }
  .labels .cell-l, .labels .cell-r { width: 38%; }
  .labels .cell-c { width: 24%; }   /* stays completely empty */
  .label {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #FC4C02;
    text-align: left;       /* left-aligned under each block */
    line-height: 1;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="overlay">

    <div class="blocks">
      <!-- LEFT — Strava: official symbol, white, centered -->
      <div class="block block-strava">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#FFFFFF" aria-label="Strava">
          <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
        </svg>
      </div>

      <!-- CENTER — Ampersand -->
      <div class="block block-amp">
        <span class="amp">&amp;</span>
      </div>

      <!-- RIGHT — Claude: official starburst, white, centered -->
      <div class="block block-claude">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#FFFFFF" aria-label="Claude">
          <path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.6211l3.0175.2247.7893.5221.4735.6376-.079.4857-1.2143.6193-1.6393-.3886-3.825-.9106-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.809 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.6207h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3522-.6071.2125-.6679-.1214-1.3721-1.9247-1.4147-2.1675-1.1414-1.9428-.1397.079-.674 7.2554-.3158.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9247.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.845-.4128.1639-.7164-.3703.0668-.6618.4007-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1578h-.0546L4.132 17.0847l-1.1293.1457-.4857-.4553.0607-.7468.2307-.243 1.9065-1.3113Z"/>
        </svg>
      </div>
    </div>

    <div class="labels">
      <div class="cell-l"><span class="label">Strava</span></div>
      <div class="cell-c"></div>
      <div class="cell-r"><span class="label">Claude</span></div>
    </div>

  </div>
</div>
</body>
</html>
